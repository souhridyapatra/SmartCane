<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #121212; color: white; }
    button { padding: 20px 40px; font-size: 24px; border-radius: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    #status { margin-top: 20px; font-size: 18px; color: #aaa; }
    #alertDisplay { margin-top: 40px; font-size: 36px; font-weight: bold; color: #00C851; }
  </style>
</head>
<body>
  <button id="connectBtn">Connect to Smart Cane</button>
  <div id="status">Status: Ready to connect</div>
  <div id="alertDisplay">Safe</div>

  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const alertDisplay = document.getElementById('alertDisplay');

    // Hexadecimal UUIDs required by Web Bluetooth
    const caneServiceUUID = 0x181a; 
    const threatCharUUID = 0x2a58;

    connectBtn.addEventListener('click', async () => {
      try {
        statusDiv.innerText = 'Status: Requesting Bluetooth...';
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'SmartCane' }],
          optionalServices: [caneServiceUUID]
        });

        statusDiv.innerText = 'Status: Connecting to Cane...';
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(caneServiceUUID);
        const characteristic = await service.getCharacteristic(threatCharUUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleThreatChange);

        statusDiv.innerText = 'Status: Connected & Listening!';
        statusDiv.style.color = '#00C851';
        connectBtn.style.display = 'none'; // Hide button once connected

      } catch (error) {
        statusDiv.innerText = 'Connection Failed: ' + error;
        statusDiv.style.color = '#ff4444';
      }
    });

    function handleThreatChange(event) {
      // Read the single byte sent by the Arduino (0, 1, 2, 3, or 4)
      const value = event.target.value.getUint8(0);
      let message = "";

      switch (value) {
        case 1: 
          message = "Knee obstacle"; 
          alertDisplay.style.color = "#ffbb33"; 
          break;
        case 2: 
          message = "Chest obstacle"; 
          alertDisplay.style.color = "#ff8800"; 
          break;
        case 3: 
          message = "Head obstacle"; 
          alertDisplay.style.color = "#ff4444"; 
          break;
        case 4: 
          message = "Drop off detected"; 
          alertDisplay.style.color = "#cc0000"; 
          break;
        default: 
          message = "Safe"; 
          alertDisplay.style.color = "#00C851"; 
          break;
      }

      alertDisplay.innerText = message;

      // Trigger Text-to-Speech if there is an active threat
      if (value !== 0) {
        window.speechSynthesis.cancel(); // Stop any currently playing audio
        const speech = new SpeechSynthesisUtterance(message);
        speech.rate = 1.3; // Speak slightly faster for urgent alerts
        window.speechSynthesis.speak(speech);
      }
    }
  </script>
</body>
</html>
